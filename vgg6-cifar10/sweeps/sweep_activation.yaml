# Q2(a): 5 runs. Only the activation changes (Adam, lr 1e-3, bs 128, 30 epochs).
program: train.py
method: grid
metric: {name: val_acc, goal: maximize}
parameters:
  activation: {values: [relu, sigmoid, tanh, silu, gelu]}
  optimizer: {value: adam}
  lr: {value: 0.001}
  batch_size: {value: 128}
  epochs: {value: 30}
  batch_norm: {value: true}
  weight_decay: {value: 0.00005}
  momentum: {value: 0.9}
  seed: {value: 42}
